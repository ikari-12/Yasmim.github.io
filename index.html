<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Pênaltis Pro</title>
<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:linear-gradient(#4facfe,#00f2fe);
}

#campo{
    position:relative;
    width:100vw;
    height:100vh;
    background:linear-gradient(#2e8b57,#1f5f3f);
}

#gol{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    width:500px;
    height:180px;
    border:6px solid white;
    border-bottom:none;
}

#goleiro{
    position:absolute;
    top:14%;
    left:50%;
    width:90px;
    height:140px;
    background-image:url("https://i.imgur.com/9Q9ZQZV.png");
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    transition:left 0.4s ease;
}

#bola{
    position:absolute;
    bottom:80px;
    left:50%;
    width:45px;
    height:45px;
    background-image:url("https://i.imgur.com/8Qf6G6C.png");
    background-size:cover;
    border-radius:50%;
    cursor:pointer;
    transition:all 0.6s cubic-bezier(.17,.67,.83,.67);
}

#placar{
    position:absolute;
    top:20px;
    left:20px;
    font-size:22px;
    color:white;
}

#mensagem{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:40px;
    color:white;
    display:none;
}
</style>
</head>
<body>

<div id="campo">
    <div id="placar">Pontos: 0</div>
    <div id="mensagem"></div>
    <div id="gol"></div>
    <div id="goleiro"></div>
    <div id="bola"></div>
</div>

<script>
const bola = document.getElementById("bola");
const goleiro = document.getElementById("goleiro");
const placar = document.getElementById("placar");
const mensagem = document.getElementById("mensagem");

let pontos = 0;
let chutes = 0;
let startX = 0;
let startY = 0;
let larguraTela = window.innerWidth;

function centralizarGoleiro(){
    goleiro.style.left = (larguraTela/2 - 45) + "px";
}

centralizarGoleiro();

function iniciarChute(e){
    const evento = e.touches ? e.touches[0] : e;
    startX = evento.clientX;
    startY = evento.clientY;

    document.addEventListener("mouseup", finalizarChute);
    document.addEventListener("touchend", finalizarChute);
}

function finalizarChute(e){
    document.removeEventListener("mouseup", finalizarChute);
    document.removeEventListener("touchend", finalizarChute);

    const evento = e.changedTouches ? e.changedTouches[0] : e;
    const deltaX = evento.clientX - startX;
    const destinoX = larguraTela/2 + deltaX;

    chutes++;
    const defesaAutomatica = (chutes % 4 === 0);

    bola.style.bottom = "70%";
    bola.style.left = (destinoX - 22) + "px";
    bola.style.transform = "scale(0.5)";

    setTimeout(()=>{
        verificarGol(destinoX, defesaAutomatica);
        resetar();
    },600);
}

function verificarGol(x, defesaAutomatica){
    const golEsquerda = larguraTela/2 - 250;
    const golDireita = larguraTela/2 + 250;

    if(defesaAutomatica){
        moverParaLado(x);
        mostrarMensagem("DEFESA!");
        return;
    }

    if(x > golEsquerda && x < golDireita){
        pontos += 10;
        mostrarMensagem("GOOOOL!");
    } else {
        mostrarMensagem("Pra Fora!");
    }

    placar.innerText = "Pontos: " + pontos;

    if(pontos >= 100){
        mostrarMensagem("🏆 VOCÊ GANHOU!");
        pontos = 0;
        chutes = 0;
    }
}

function moverParaLado(x){
    if(x < larguraTela/2){
        goleiro.style.left = (larguraTela/2 - 200) + "px";
    } else {
        goleiro.style.left = (larguraTela/2 + 110) + "px";
    }
}

function mostrarMensagem(texto){
    mensagem.innerText = texto;
    mensagem.style.display = "block";
    setTimeout(()=> mensagem.style.display="none",1000);
}

function resetar(){
    bola.style.transition="none";
    bola.style.bottom="80px";
    bola.style.left="50%";
    bola.style.transform="scale(1)";
    centralizarGoleiro();
    setTimeout(()=> bola.style.transition="all 0.6s cubic-bezier(.17,.67,.83,.67)",50);
}

function moverGoleiroAleatorio(){
    const random = Math.random()*300 - 150;
    goleiro.style.left = (larguraTela/2 - 45 + random) + "px";
}

setInterval(moverGoleiroAleatorio,1500);

bola.addEventListener("mousedown", iniciarChute);
bola.addEventListener("touchstart", iniciarChute);

window.addEventListener("resize", ()=>{
    larguraTela = window.innerWidth;
    centralizarGoleiro();
});
</script>

</body>
</html>
